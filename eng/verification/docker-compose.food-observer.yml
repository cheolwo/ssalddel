name: ssalddel-food-observer
services:
  app:
    build:
      context: ../..
      dockerfile: Ssalddel/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_RUNNING_IN_CONTAINER: "true"
      SsalddelExecution__Mode: Simulation
      DatabaseInitialization__RunAtStartup: "false"
      ConnectionStrings__DefaultConnection: "server=mysql;database=ssalddel_food_observer;user=observer;password=${FOOD_OBSERVER_DB_PASSWORD:?run verification script};"
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__Database: ssalddel_food_observer
      TransientState__Provider: Memory
      VersionFeatureFlags__FoodDeliveryWorkflow: "true"
      FoodObserverVerification__Enabled: "true"
      FoodObserverVerification__AccessKey: ${FOOD_OBSERVER_ACCESS_KEY:?run verification script}
      FoodObserverVerification__AccountPassword: ${FOOD_OBSERVER_ACCOUNT_PASSWORD:?run verification script}
      Jwt__Issuer: FoodObserver.Local
      Jwt__Audience: FoodObserver.Local
      Jwt__SecretKey: ${FOOD_OBSERVER_JWT_KEY:?run verification script}
      IsmsPProtectedData__Aes256GcmKeyBase64: ${FOOD_OBSERVER_AES_KEY:?run verification script}
      IsmsPProtectedData__HashSalt: ${FOOD_OBSERVER_HASH_SALT:?run verification script}
      IsmsPProtectedData__FailWhenKeyMissing: "true"
      PersonalDataProtection__KeyRingPath: /app/App_Data/DataProtection-Keys
      Logging__LogLevel__Default: Warning
      Serilog__MinimumLevel__Default: Warning
      TossPayments__SecretKey: ""
      AgriculturalFisheriesBatch__Enabled: "false"
      CommunityPostEmailNotifications__Enabled: "false"
      CommunityPostTranslation__Enabled: "false"
    depends_on:
      mysql: {condition: service_healthy}
      mongo: {condition: service_healthy}
    volumes:
      - observer_app:/app/App_Data
      - type: bind
        source: ../../artifacts/local/verification/food-observer/menus.json
        target: /app/observer-input/menus.json
        read_only: true
        bind:
          create_host_path: false
    networks: [isolated]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/verification/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
  gateway:
    image: caddy:2.10-alpine
    command: ["caddy", "reverse-proxy", "--from", "http://:8080", "--to", "http://app:8080"]
    ports: ["127.0.0.1:5215:8080"]
    networks: [access, isolated]
    depends_on: [app]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ssalddel_food_observer
      MYSQL_USER: observer
      MYSQL_PASSWORD: ${FOOD_OBSERVER_DB_PASSWORD:?run verification script}
      MYSQL_ROOT_PASSWORD: ${FOOD_OBSERVER_ROOT_PASSWORD:?run verification script}
    volumes: ["observer_mysql:/var/lib/mysql"]
    networks: [isolated]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:8.0
    volumes: ["observer_mongo:/data/db"]
    networks: [isolated]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 30
networks:
  access:
  isolated:
    internal: true
volumes:
  observer_app:
    name: ${FOOD_OBSERVER_APP_VOLUME:-ssalddel-food-observer_observer_app}
  observer_mysql:
    name: ${FOOD_OBSERVER_MYSQL_VOLUME:-ssalddel-food-observer_observer_mysql}
  observer_mongo:
    name: ${FOOD_OBSERVER_MONGO_VOLUME:-ssalddel-food-observer_observer_mongo}
